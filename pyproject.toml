[project]
name = "video2skill"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mlx-whisper",
  "pydantic==2.13.4",
  "python-dotenv==1.1.1",
  "uvicorn==0.35.0",
  "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
